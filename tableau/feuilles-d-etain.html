<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;1,200;1,300&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta property="og:type" content="website"><meta property="og:site_name" content="Nathalie Cublier"><meta name="theme-color" content="#FAFAF8"><link rel="stylesheet" href="/nc.css"><script src="/nc.js" defer></script>
<title>Feuilles d&#x27;étain — Nathalie Cublier, encre de Chine</title>
<meta name="description" content="Feuilles d&#x27;étain, tableau à l&#x27;encre de Chine de Nathalie Cublier, Formes, miroirs et objets. 70 × 50 cm hors cadre. Des feuilles longues, dessinées en nervures d&#x27;étain, sur une toile verticale.">
<meta property="og:title" content="Feuilles d&#x27;étain — Nathalie Cublier"><meta property="og:image" content="https://static.wixstatic.com/media/890b5a_73136895b904448bbb96124e93dd7616~mv2.png/v1/fill/w_1200,h_1695,al_c,q_85/feuilles-d-etain.png"><link rel="canonical" href="https://www.nathalie-cublier.fr/tableau/feuilles-d-etain">
</head>
<body data-solid="1">
<main>
<section class="wrap fiche-grid" id="fiche">
<div class="fiche-im"><div class="fr" id="f-fr" role="button" tabindex="0"><img id="f-img" src="" alt=""><span class="zb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M11 8v6M8 11h6"/></svg>Voir le trait</span></div>
<div class="echelle" id="f-ech" aria-label="Le tableau à l'échelle sur un mur"></div><div id="f-murs"></div></div>
<div class="fiche-txt">
<span class="k" id="f-k"></span>
<h1 id="f-t"></h1>
<p class="hist" id="f-h"></p>
<dl id="f-dl"></dl>
<div class="hours-pill"><b id="f-hrs">150</b> heures de dessin, un seul exemplaire</div>
<p class="jours" id="f-j"></p>
<div class="prix"><div><b id="f-p"></b><small>Fourchette indicative, encadrement compris. Prix exact à la demande.</small></div><button class="heart" id="f-heart" type="button" aria-label="Ajouter à ma sélection" style="position:static;opacity:1;border:1px solid var(--filet)"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg></button></div>
<div class="acts" id="f-acts"></div>
<p style="font-size:13.5px;color:var(--gris)">Encadrement par un professionnel. Remise en main propre près de Cannes, ou envoi encadré partout en France.</p>
</div>
</section>
<section class="wrap" style="padding-bottom:40px"><div class="fiche-nav" id="f-nav"></div></section>
<section class="wrap" style="padding-bottom:80px"><div class="sec-head"><h2 class="h-l"><span class="stroke">Du même thème.</span></h2></div><div class="trio" id="f-rel"></div></section>
</main>
<script>
document.addEventListener('DOMContentLoaded', () => {
const fromPath = location.pathname.match(/\/tableau\/([\w-]+)/), id = (fromPath && fromPath[1]) || new URLSearchParams(location.search).get('id'), i = Math.max(0, NC.WORKS.findIndex(w => w.id === id)), a = NC.WORKS[i];
document.title = a.t + ' — Nathalie Cublier, encre de Chine';
const img = document.getElementById('f-img'); img.src = NC.src(a, 1400); img.alt = a.t; img.width = a.w; img.height = a.h;
document.getElementById('f-fr').dataset.zoom = a.id;
document.getElementById('f-k').textContent = NC.TH[a.th] + ' · ' + NC.ST[a.st];
document.getElementById('f-t').textContent = a.t;
document.getElementById('f-h').textContent = a.hist || '';
document.getElementById('f-dl').innerHTML = (a.f ? '<dt>Format</dt><dd>' + a.f + '</dd>' : '') + '<dt>Technique</dt><dd>Encre de Chine sur toile</dd>' + (a.rel ? '<dt>Particularité</dt><dd>' + a.rel + '</dd>' : '') + '<dt>Statut</dt><dd><span class="st ' + a.st + '">' + NC.ST[a.st] + '</span></dd>';
const h = NC.hrs(a); document.getElementById('f-hrs').textContent = 'Environ ' + h; document.getElementById('f-j').textContent = 'Soit ' + NC.jours(h) + ', sans esquisse ni gomme : à l\'encre, chaque trait reste.';
const [p1, p2] = NC.prix(h); document.getElementById('f-p').textContent = a.st === 'vendu' ? 'Vendu' : NC.eur(p1) + ' à ' + NC.eur(p2);
document.getElementById('f-acts').innerHTML = a.st === 'dispo' ? '<button class="btn btn-sceau" data-open="ecrire">Demander ce tableau</button><a class="btn btn-line" href="/commander?theme=' + encodeURIComponent(NC.TH[a.th]) + '">Commander sur ce thème</a>' : '<a class="btn btn-ink" href="/commander?theme=' + encodeURIComponent(NC.TH[a.th]) + '">Commander sur ce thème</a><a class="btn btn-line" href="/tableaux#' + a.th + '">Tableaux du même thème</a>';
const heart = document.getElementById('f-heart'); heart.dataset.heart = a.id; heart.classList.toggle('on', NC.SEL.has(a.id));
const ech = NC.echelle(document.getElementById('f-ech'), a); document.getElementById('f-murs').innerHTML = NC.mursHTML(); NC.bindMurs(document.getElementById('f-murs'), document.getElementById('f-ech'));
const prev = NC.WORKS[(i - 1 + NC.WORKS.length) % NC.WORKS.length], next = NC.WORKS[(i + 1) % NC.WORKS.length];
document.getElementById('f-nav').innerHTML = '<a class="prev" href="' + NC.url(prev) + '"><img src="' + NC.src(prev, 200) + '" alt=""><div><small>Précédent</small><b>' + prev.t + '</b></div></a><a class="next" href="' + NC.url(next) + '"><div><small>Suivant</small><b>' + next.t + '</b></div><img src="' + NC.src(next, 200) + '" alt=""></a>';
const rel = document.getElementById('f-rel'); rel.innerHTML = NC.WORKS.filter(w => w.th === a.th && w.id !== a.id).slice(0, 3).map(NC.tile).join(''); NC.bindLens(rel); NC.bindZoom(rel);
NC.bindZoom(document.getElementById('fiche'));
addEventListener('keydown', e => { if (document.querySelector('.zoomer.on, .drawer.open')) return; if (e.key === 'ArrowRight') location.href = NC.url(next); if (e.key === 'ArrowLeft') location.href = NC.url(prev); });
});
</script>
</body>
</html>
