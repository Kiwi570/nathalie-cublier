<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;1,200;1,300&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta property="og:type" content="website"><meta property="og:site_name" content="Nathalie Cublier"><meta property="og:image" content="https://static.wixstatic.com/media/890b5a_907b1bdf4c2745c1bc7b7e5aa56e5ca0~mv2.png/v1/fill/w_1200,h_1204,al_c,q_85/fleur.png"><meta name="theme-color" content="#FAFAF8"><link rel="stylesheet" href="/nc.css"><script src="/nc.js" defer></script>
<title>Tableau — Nathalie Cublier, encre de Chine</title>
<meta name="description" content="Fiche d'un tableau à l'encre de Chine de Nathalie Cublier : format, statut, histoire de la pièce, zoom sur le trait.">
</head>
<body data-solid="1">
<main>
<section class="wrap fiche-grid" id="fiche">
  <div class="fiche-im"><div class="fr" id="f-fr" role="button" tabindex="0"><img id="f-img" src="" alt=""><span class="zb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M11 8v6M8 11h6"/></svg>Voir le trait</span></div></div>
  <div class="fiche-txt">
    <span class="k" id="f-k"></span>
    <h1 id="f-t"></h1>
    <p class="hist" id="f-h"></p>
    <dl id="f-dl"></dl>
    <div class="hours-pill"><b>100 à 200</b> heures de dessin, un seul exemplaire</div>
    <div class="acts" id="f-acts"></div>
    <p style="font-size:13.5px;color:var(--gris)">Encadrement par un professionnel. Remise en main propre près de Cannes, ou envoi encadré partout en France.</p>
  </div>
</section>
<section class="wrap" style="padding-bottom:80px"><div class="fiche-nav" id="f-nav"></div></section>
</main>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const id = new URLSearchParams(location.search).get('id'), i = Math.max(0, NC.WORKS.findIndex(w => w.id === id)), a = NC.WORKS[i];
  document.title = a.t + ' — Nathalie Cublier, encre de Chine';
  const img = document.getElementById('f-img'); img.src = NC.src(a, 1400); img.alt = a.t; img.width = a.w; img.height = a.h;
  document.getElementById('f-fr').dataset.zoom = a.id;
  document.getElementById('f-k').textContent = NC.TH[a.th] + ' · ' + NC.ST[a.st];
  document.getElementById('f-t').textContent = a.t;
  document.getElementById('f-h').textContent = a.hist || '';
  document.getElementById('f-dl').innerHTML = (a.f ? '<dt>Format</dt><dd>' + a.f + '</dd>' : '') + '<dt>Technique</dt><dd>Encre de Chine sur toile</dd>' + (a.rel ? '<dt>Particularité</dt><dd>' + a.rel + '</dd>' : '') + '<dt>Statut</dt><dd><span class="st ' + a.st + '">' + NC.ST[a.st] + '</span></dd>';
  document.getElementById('f-acts').innerHTML = a.st === 'dispo' ? '<a class="btn btn-sceau" href="/commander#demande?sujet=' + encodeURIComponent(a.t) + '">Demander ce tableau</a><a class="btn btn-line" href="/commander?theme=' + encodeURIComponent(NC.TH[a.th]) + '">Commander sur ce thème</a>' : '<a class="btn btn-ink" href="/commander?theme=' + encodeURIComponent(NC.TH[a.th]) + '">Commander sur ce thème</a><a class="btn btn-line" href="/tableaux#' + a.th + '">Tableaux du même thème</a>';
  const prev = NC.WORKS[(i - 1 + NC.WORKS.length) % NC.WORKS.length], next = NC.WORKS[(i + 1) % NC.WORKS.length];
  document.getElementById('f-nav').innerHTML = '<a class="prev" href="/tableau?id=' + prev.id + '"><img src="' + NC.src(prev, 200) + '" alt=""><div><small>Précédent</small><b>' + prev.t + '</b></div></a><a class="next" href="/tableau?id=' + next.id + '"><div><small>Suivant</small><b>' + next.t + '</b></div><img src="' + NC.src(next, 200) + '" alt=""></a>';
  NC.bindZoom(document.getElementById('fiche'));
  addEventListener('keydown', e => { if (document.querySelector('.zoomer.on')) return; if (e.key === 'ArrowRight') location.href = '/tableau?id=' + next.id; if (e.key === 'ArrowLeft') location.href = '/tableau?id=' + prev.id; });
});
</script>
</body>
</html>
